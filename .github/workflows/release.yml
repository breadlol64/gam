name: Build and Release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

jobs:
    build_linux:
        name: Build for Linux
        runs-on: ubuntu-22.04

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Install Dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    git \
                    build-essential \
                    libx11-dev \
                    libxrandr-dev \
                    libxinerama-dev \
                    libxcursor-dev \
                    libxi-dev \
                    libgl1-mesa-dev

            - name: Install Odin Compiler
              run: |
                  git clone --depth 1 https://github.com/odin-lang/Odin.git
                  cd Odin
                  make
                  echo "$GITHUB_WORKSPACE/Odin" >> $GITHUB_PATH
                  cd ..

            - name: Build for Linux
              run: |
                  odin build . -file -out:game_linux -target:linux_amd64

            - name: Upload Linux Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: game-linux
                  path: game_linux

    build_windows:
        name: Build for Windows
        runs-on: windows-2022

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Install Odin Compiler
              # You can fetch the pre-built Odin windows zip or build it using MSVC
              run: |
                  git clone --depth 1 https://github.com/odin-lang/Odin.git
                  cd Odin
                  .\build.bat
                  echo "$PWD" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                  cd ..

            - name: Build for Windows
              run: |
                  odin build . -file -out:game.exe -target:windows_amd64 -vet -disable-assert

            - name: Upload Windows Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: game-windows
                  path: game.exe

    release:
        name: Create GitHub Release
        needs: [build_linux, build_windows]
        runs-on: ubuntu-22.04
        steps:
            - name: Download Linux Artifact
              uses: actions/download-artifact@v4
              with:
                  name: game-linux
                  path: build_output/linux/

            - name: Download Windows Artifact
              uses: actions/download-artifact@v4
              with:
                  name: game-windows
                  path: build_output/windows/

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      build_output/linux/game_linux
                      build_output/windows/game.exe
                  fail_on_unmatched_files: false
                  prerelease: false
                  draft: false
